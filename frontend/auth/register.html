<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sapiens Lumen | Registro</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/ajolote.css">
  <style>
    .auth-container.wide { max-width: 720px; }
    .companion-step { margin-top: 8px; }
    .companion-step h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
      color: var(--text);
    }
    .companion-step .hint {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 14px;
    }
    .companion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px 2px 8px;
    }
    @media (max-width: 560px) {
      .companion-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .companion-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px 10px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--input-bg);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      text-align: center;
    }
    .companion-card img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      pointer-events: none;
    }
    .companion-card .cname {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }
    .companion-card .cdesc {
      font-size: 0.68rem;
      color: var(--text-light);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .companion-card:hover {
      border-color: var(--green-soft);
      transform: translateY(-2px);
    }
    .companion-card.selected {
      border-color: var(--olive);
      box-shadow: 0 0 0 3px var(--glow), 0 8px 20px var(--glow);
      background: rgba(129, 199, 132, 0.12);
    }
    .companion-card.selected::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--btn);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .companion-preview {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(129, 199, 132, 0.15);
      border: 1px solid var(--border);
    }
    .companion-preview.visible { display: flex; }
    .companion-preview img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    .companion-preview strong { display: block; font-size: 0.95rem; }
    .companion-preview span { font-size: 0.8rem; color: var(--text-light); }
  </style>
  <link rel="icon" type="image/png" href="/img/pato.png">
</head>
<body class="auth-page">

  <div class="auth-container wide">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="mascot-nametag">Quacky</div>
        <a href="../inicio/inicio.html" class="auth-logo-link" title="Ir al inicio" aria-label="Ir al inicio"><img src="../img/pato.png" alt="Quacky"></a>
        <h1>Sapiens Lumen</h1>
        <p>Crea tu cuenta y elige tu compañero</p>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <h2>Crear cuenta</h2>

        <div class="form-group">
          <label for="name"><i class="fa-solid fa-user"></i> Nombre</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" required autocomplete="given-name">
        </div>

        <div class="form-group">
          <label for="lastName"><i class="fa-solid fa-user"></i> Apellido</label>
          <input type="text" id="lastName" name="lastName" placeholder="Tu apellido" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label for="password2"><i class="fa-solid fa-lock"></i> Confirmar contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password2" name="password2" placeholder="Repite la contraseña" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label for="grade"><i class="fa-solid fa-graduation-cap"></i> Grado escolar</label>
          <select id="grade" name="grade" required style="width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;background:var(--input-bg);color:var(--text);font-size:1rem;outline:none;font-family:inherit;">
            <option value="" disabled selected>Selecciona tu grado</option>
            <option value="6">6° — Básico</option>
            <option value="7">7° — Básico</option>
            <option value="8">8° — Intermedio</option>
            <option value="9">9° — Intermedio</option>
            <option value="10">10° — Avanzado</option>
            <option value="11">11° — Avanzado</option>
          </select>
        </div>

        <!-- ELECCIÓN DE COMPAÑERO -->
        <div class="companion-step">
          <h3><i class="fa-solid fa-paw"></i> Elige tu compañero</h3>
          <p class="hint">Te acompañará en todo el proceso. (Maestro Cheddar y Quacky siguen con todos.)</p>
          <input type="hidden" id="companionId" name="companionId" value="">
          <div class="companion-grid" id="companionGrid" role="listbox" aria-label="Compañeros disponibles"></div>
          <div class="companion-preview" id="companionPreview">
            <img src="" alt="" id="previewImg">
            <div>
              <strong id="previewName"></strong>
              <span id="previewDesc"></span>
            </div>
          </div>
        </div>

        <div class="form-error" id="formError" hidden></div>

        <button type="submit" class="auth-btn">
          <i class="fa-solid fa-user-plus"></i> Registrarme
        </button>
      </form>

      <div class="auth-divider"><span>o</span></div>
      <div id="googleBtn" class="google-wrap"></div>

      <p class="auth-switch">
        ¿Ya tienes cuenta? <a href="../auth/login.html">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="../js/difficulty.js"></script>
  <script src="../js/companions.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (SapiensAuth.isLoggedIn()) {
      window.location.href = '../home/home.html';
    }

    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    /* —— Grid de compañeros —— */
    const grid = document.getElementById('companionGrid');
    const hidden = document.getElementById('companionId');
    const preview = document.getElementById('companionPreview');
    let selectedId = null;

    SapiensCompanions.list().forEach(c => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'companion-card';
      card.setAttribute('role', 'option');
      card.dataset.id = c.id;
      card.innerHTML =
        '<img src="' + c.img + '" alt="' + c.name + '">' +
        '<span class="cname">' + c.name + '</span>' +
        (c.description ? '<span class="cdesc">' + c.description + '</span>' : '');
      card.addEventListener('click', () => selectCompanion(c.id));
      grid.appendChild(card);
    });

    function selectCompanion(id) {
      selectedId = id;
      hidden.value = id;
      grid.querySelectorAll('.companion-card').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === id);
      });
      const c = SapiensCompanions.getById(id);
      if (c) {
        document.getElementById('previewImg').src = c.img;
        document.getElementById('previewImg').alt = c.name;
        document.getElementById('previewName').textContent = c.name;
        document.getElementById('previewDesc').textContent = c.description || '';
        preview.classList.add('visible');
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const grade = document.getElementById('grade').value;
      const companionId = document.getElementById('companionId').value;
      const errEl = document.getElementById('formError');

      if (password !== password2) {
        errEl.textContent = 'Las contraseñas no coinciden.';
        errEl.hidden = false;
        return;
      }
      if (!grade) {
        errEl.textContent = 'Selecciona tu grado escolar (6° a 11°).';
        errEl.hidden = false;
        return;
      }
      if (!companionId) {
        errEl.textContent = 'Elige un compañero para acompañarte en el aprendizaje.';
        errEl.hidden = false;
        return;
      }

      const btn = e.target.querySelector('.auth-btn');
      const original = btn.innerHTML;
      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Creando cuenta…';

      const result = await SapiensAuth.register({ name, lastName, email, password, grade, companionId });
      if (result.ok) {
        SapiensCompanions.setSelected(companionId);
        window.location.href = '../home/home.html';
      } else {
        errEl.textContent = result.error || 'No se pudo registrar.';
        errEl.hidden = false;
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });

    // Registrarse / entrar con Google (si la cuenta es nueva, se pide el grado en el panel)
    SapiensAuth.initGoogle(
      'googleBtn',
      () => { window.location.href = '../home/home.html'; },
      (mensaje) => {
        const errEl = document.getElementById('formError');
        errEl.textContent = mensaje;
        errEl.hidden = false;
      }
    );
  </script>
</body>
</html>
