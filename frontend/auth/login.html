<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sapiens Lumen | Iniciar sesión</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/ajolote.css">
  <link rel="icon" type="image/png" href="/img/pato.png">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="mascot-nametag" style="margin-bottom:8px;">Quacky</div>
        <img src="../img/pato.png" alt="Quacky">
        <h1>Sapiens Lumen</h1>
        <p>Aprende jugando, brilla aprendiendo</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <h2>Iniciar sesión</h2>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-error" id="formError" hidden></div>

        <button type="submit" class="auth-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
      </form>

      <div class="auth-divider">
        <span>o</span>
      </div>

      <div id="googleBtn" class="google-wrap"></div>

      <p class="auth-switch">
        ¿No tienes cuenta? <a href="../auth/register.html">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
    // Si ya está logueado, ir al home
    if (SapiensAuth.isLoggedIn()) {
      window.location.href = '../home/home.html';
    }

    // Toggle password
    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('formError');
      const btn = e.target.querySelector('.auth-btn');
      const original = btn.innerHTML;

      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      const result = await SapiensAuth.login({ email, password });
      if (result.ok) {
        window.location.href = '../home/home.html';
      } else {
        errEl.textContent = result.error;
        errEl.hidden = false;
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });

    // Continuar con Google (cuenta real, verificada por el servidor)
    SapiensAuth.initGoogle(
      'googleBtn',
      () => { window.location.href = '../home/home.html'; },
      (mensaje) => {
        const errEl = document.getElementById('formError');
        errEl.textContent = mensaje;
        errEl.hidden = false;
      }
    );
  </script>
</body>
</html>
